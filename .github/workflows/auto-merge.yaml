---
name: 'Auto merge'
'on':
  pull_request_review:
    types: [submitted]

jobs:
  auto-merge:
    uses: conforma/github-workflows/.github/workflows/auto-merge.yaml@eb2bb495b1fca0a52cc1a1e2bfb1c28a6283798a # main
    secrets: inherit
    permissions:
      pull-requests: write
      contents: write
