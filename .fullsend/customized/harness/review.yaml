base: https://raw.githubusercontent.com/fullsend-ai/agents/ce2eedd097dcccf17e29f4a7cd337ec4d95d7194/harness/review.yaml#sha256=3e9302d8143fcfd93df8e4542162776e98893c8ef367450679e2ffa89e5b0c53

# Fullsend's bool merge treats an omitted readonly_repo as false, so carry
# forward the upstream read-only guarantee explicitly.
readonly_repo: true

env:
    runner:
        REVIEW_FINDING_SEVERITY_THRESHOLD: "high"
    sandbox:
        REVIEW_FINDING_SEVERITY_THRESHOLD: "high"
