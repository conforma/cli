base: https://raw.githubusercontent.com/fullsend-ai/agents/3b40ac718d29c3190b71e68447b9f4e938f19974/harness/review.yaml#sha256=99998321e3b7aba7f0c1cc68b50f383436147fb6ee59e506f6d156445308bf9d

# Fullsend's bool merge treats an omitted readonly_repo as false, so carry
# forward the upstream read-only guarantee explicitly.
readonly_repo: true

env:
    runner:
        REVIEW_FINDING_SEVERITY_THRESHOLD: "high"
    sandbox:
        REVIEW_FINDING_SEVERITY_THRESHOLD: "high"
