<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conforma Playground PoC</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #5f6b7a;
        --line: #d9e0ea;
        --accent: #0066cc;
        --danger: #b42318;
        --success: #137333;
        --shadow: 0 8px 22px rgba(17, 24, 39, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
      }

      section {
        min-width: 0;
      }

      .editor-grid {
        display: grid;
        grid-template-rows: minmax(280px, 1fr) minmax(180px, 0.65fr) minmax(140px, 0.45fr);
        gap: 16px;
        min-height: calc(100vh - 98px);
      }

      .panel {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
      }

      textarea,
      pre {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        resize: none;
        outline: none;
        padding: 14px;
        overflow: auto;
        font:
          13px/1.5 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        tab-size: 2;
      }

      textarea {
        color: var(--ink);
        background: #fbfcfe;
      }

      pre {
        white-space: pre-wrap;
        color: #111827;
        background: #fbfcfe;
      }

      button {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid #0059b3;
        border-radius: 6px;
        color: #ffffff;
        background: var(--accent);
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .result-pass {
        color: var(--success);
        font-weight: 700;
      }

      .result-fail {
        color: var(--danger);
        font-weight: 700;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }

        .editor-grid {
          min-height: auto;
          grid-template-rows: 320px 240px;
        }

        .panel.output {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Conforma Playground PoC</h1>
      <div id="status" class="status">Loading WASM...</div>
    </header>

    <main>
      <section class="editor-grid" aria-label="Playground inputs">
        <div class="panel">
          <div class="panel-head">
            <h2>Rego Modules</h2>
          </div>
          <textarea id="policy" spellcheck="false"># file: main.rego
package main

import rego.v1

import data.lib.pipeline
import data.lib.release

# METADATA
# title: Required build task is present
# custom:
#   short_name: required_task_missing
deny contains result if {
  not pipeline.has_required_task(input, "build-container")
  result := {
    "code": "main.required_task_missing",
    "msg": "required task build-container is missing",
    "metadata": {
      "component": object.get(input, "component", "unknown"),
    },
  }
}

# METADATA
# title: Attestation signer is allowed
# custom:
#   short_name: signer_not_allowed
deny contains result if {
  not release.allowed_signer(input.attestation.signer)
  result := {
    "code": "main.signer_not_allowed",
    "msg": sprintf("attestation signer %q is not allowed", [input.attestation.signer]),
    "metadata": {
      "signer": input.attestation.signer,
    },
  }
}

# METADATA
# title: Application label is present
# custom:
#   short_name: application_label_missing
warn contains result if {
  not input.metadata.labels["appstudio.openshift.io/application"]
  result := {
    "code": "main.application_label_missing",
    "msg": "application label is recommended",
  }
}

# file: lib/pipeline.rego
package lib.pipeline

import rego.v1

has_required_task(snapshot, task_name) if {
  some task in snapshot.pipeline.tasks
  task.name == task_name
}

# file: lib/release.rego
package lib.release

import rego.v1

allowed_signer(signer) if {
  data.allowed_signers[_] == signer
}</textarea>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Input JSON or YAML</h2>
            <button id="run" disabled>Run</button>
          </div>
          <textarea id="input" spellcheck="false">component: demo-service
metadata:
  labels: {}
pipeline:
  tasks:
    - name: unit-test
attestation:
  signer: https://untrusted.example/signer</textarea>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Data JSON or YAML</h2>
          </div>
          <textarea id="data" spellcheck="false">allowed_signers:
  - https://tekton.dev/chains/trusted</textarea>
        </div>
      </section>

      <section class="panel output" aria-label="Validation output">
        <div class="panel-head">
          <h2>Output</h2>
          <span id="summary" class="status">Waiting</span>
        </div>
        <pre id="output">Build playground.wasm, serve this directory, then run the validation.</pre>
      </section>
    </main>

    <script src="wasm_exec.js"></script>
    <script>
      const statusEl = document.querySelector("#status");
      const summaryEl = document.querySelector("#summary");
      const runButton = document.querySelector("#run");
      const policyEl = document.querySelector("#policy");
      const inputEl = document.querySelector("#input");
      const dataEl = document.querySelector("#data");
      const outputEl = document.querySelector("#output");

      async function loadWasm() {
        const go = new Go();
        const response = await fetch("playground.wasm");
        const bytes = await response.arrayBuffer();
        const result = await WebAssembly.instantiate(bytes, go.importObject);
        go.run(result.instance);
      }

      function renderResult(raw) {
        outputEl.textContent = raw;
        try {
          const parsed = JSON.parse(raw);
          if (parsed.success) {
            summaryEl.textContent = "Pass";
            summaryEl.className = "result-pass";
          } else {
            summaryEl.textContent = "Fail";
            summaryEl.className = "result-fail";
          }
        } catch {
          summaryEl.textContent = "Error";
          summaryEl.className = "result-fail";
        }
      }

      runButton.addEventListener("click", () => {
        const raw = window.conformaPlaygroundValidate(policyEl.value, inputEl.value, dataEl.value);
        renderResult(raw);
      });

      loadWasm()
        .then(() => {
          statusEl.textContent = "WASM ready";
          runButton.disabled = false;
          renderResult(window.conformaPlaygroundValidate(policyEl.value, inputEl.value, dataEl.value));
        })
        .catch((error) => {
          statusEl.textContent = "WASM failed to load";
          summaryEl.textContent = "Error";
          summaryEl.className = "result-fail";
          outputEl.textContent = String(error);
        });
    </script>
  </body>
</html>
